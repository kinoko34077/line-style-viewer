<!DOCTYPE html>
<html lang="ja" data-theme="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LINE風トーク作成</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- Native-looking conversation shell. Only settings/import actually work:
       source TXT contains no credentials, live chat connection or media. -->
  <div class="app-shell" id="appShell">
    <header class="conversation-header viewer-header">
      <span class="chrome-icon back-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m15 3-9 9 9 9"/></svg></span>
      <h1 id="conversationTitle">トーク履歴</h1>
      <div class="header-icons editor-actions">
        <button class="chrome-icon" id="undoButton" type="button" aria-label="元に戻す" title="元に戻す" disabled><svg viewBox="0 0 24 24"><path d="M9 6 3 12l6 6M3 12h11a7 7 0 0 1 0 14" transform="translate(0,-5)"/></svg></button>
        <button class="chrome-icon" id="redoButton" type="button" aria-label="やり直す" title="やり直す" disabled><svg viewBox="0 0 24 24"><path d="m15 6 6 6-6 6M21 12H10a7 7 0 0 0-7 7"/></svg></button>
        <button class="chrome-icon" id="saveButton" type="button" aria-label="プロジェクトを保存" title="TXT / JSONで保存"><svg viewBox="0 0 24 24"><path d="M4 3h13l4 4v14H3V3zM7 3v7h9V3M7 21v-8h10v8"/></svg></button>
      </div>
      <button class="chrome-icon menu-toggle" id="menuToggle" type="button" aria-label="設定を開く" aria-controls="settingsBackdrop" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M3 5h18M3 12h18M3 19h18"/></svg></button>
    </header>
    <div id="saveFormatMenu" class="save-format-menu" hidden role="group" aria-label="保存形式">
      <button type="button" id="saveTxtButton">LINE形式のTXTで保存</button>
      <button type="button" id="saveJsonButton">編集プロジェクトをJSONで保存</button>
    </div>
    <main id="chatContainer" role="log" aria-label="トーク履歴"></main>
    <footer class="conversation-footer" aria-label="トーク作成">
      <button type="button" class="chrome-icon footer-plus" id="addMenuToggle" aria-label="メッセージ追加メニュー"><svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20"/></svg></button>
      <button type="button" class="chrome-icon footer-camera" id="addMediaButton" aria-label="写真・動画を追加"><svg viewBox="0 0 24 24"><path d="M3 7h5l2-3h5l2 3h4v14H3z"/><circle cx="12" cy="14" r="4"/></svg></button>
      <button type="button" class="chrome-icon footer-image" id="addFileButton" aria-label="ファイルを追加"><svg viewBox="0 0 24 24"><rect x="2.5" y="3.5" width="19" height="17" rx="1"/><path d="m4 18 6.5-6 4 3.5 3.5-4 3 3.5"/></svg></button>
      <div class="compose-mock"><textarea id="composeInput" rows="1" aria-label="新規メッセージ" placeholder="メッセージを入力"></textarea></div>
      <button type="button" class="send-button" id="sendButton" aria-label="メッセージを追加">送信</button>
    </footer>
    <div class="add-message-menu" id="addMessageMenu" hidden role="group" aria-label="挿入する要素">
      <button type="button" id="addIncomingButton">相手のメッセージ</button>
      <button type="button" id="addSystemButton">システムメッセージ</button>
      <button type="button" id="addDateButton">日付</button>
      <button type="button" id="addMediaPlaceholderButton">写真（未指定）</button>
      <button type="button" id="addStampPlaceholderButton">スタンプ（未指定）</button>
      <button type="button" id="addFilePlaceholderButton">ファイル（未指定）</button>
    </div>
  </div>
  <div class="settings-backdrop" id="settingsBackdrop" hidden>
    <section class="settings-panel editor-menu" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="settings-top editor-menu-title"><button id="settingsClose" type="button" aria-label="トークへ戻る">‹</button><h2 id="settingsTitle">トーク設定</h2></div>
      <div class="menu-quick-actions" aria-label="LINE風メニューの表示">
        <span><b aria-hidden="true">◁</b>通知オフ</span><span><b aria-hidden="true">♙＋</b>招待</span><span><b aria-hidden="true">⊘</b>ブロック</span>
      </div>
      <div class="menu-section">
        <button type="button" class="menu-row" data-toggle-section="profileEditor"><span>♙　相手のプロフィール</span><span class="menu-chevron">›</span></button>
        <div id="profileEditor" class="menu-expand">
          <label class="settings-field">トーク名 <input type="text" id="titleInput" maxlength="180"></label>
          <label class="settings-field">現在の投稿者 <select id="composeSpeaker"></select></label>
          <div id="participantList" class="participant-list"></div>
          <button type="button" id="addParticipantButton" class="menu-action">話者を追加</button>
        </div>
        <div class="menu-row menu-static"><span>♫　BGM</span><small>設定なし</small></div>
        <button type="button" class="menu-row" data-toggle-section="mediaGallery"><span>▣　写真・動画</span><span class="menu-chevron">›</span></button>
        <div id="mediaGallery" class="menu-expand"><div id="unassignedGallery" class="unassigned-gallery"></div></div>
        <div class="menu-row menu-static"><span>▧　アルバム</span><small>トーク内素材を参照</small></div>
        <div class="menu-row menu-static"><span>▤　ノート</span><small>未対応</small></div>
        <div class="menu-row menu-static"><span>▣　カレンダー</span><small>トーク内の日付</small></div>
        <div class="menu-row menu-static"><span>☑　イベント</span><small>未対応</small></div>
        <div class="menu-row menu-static"><span>♧　リンク</span><small>未対応</small></div>
        <button type="button" class="menu-row" data-toggle-section="mediaGallery"><span>▱　ファイル</span><span class="menu-chevron">›</span></button>
        <button type="button" class="menu-row" data-toggle-section="editorSettings"><span>⚙　作成・表示設定</span><span class="menu-chevron">›</span></button>
        <div id="editorSettings" class="menu-expand">
          <label class="settings-field"><span>全体の拡大率 <output id="scaleOutput" for="scaleControl">120%</output></span><input id="scaleControl" type="range" min="80" max="160" step="10" value="120"></label>
          <label class="settings-field"><span>着せ替え</span><select id="themeSelector"><option value="normal">通常</option><option value="black">ブラック</option><option value="white">ホワイト</option></select></label>
          <label class="settings-field file-picker">LINE TXT/MDを読み込み <input type="file" id="fileInput" accept=".txt,.md"></label>
          <label class="settings-field">保存したプロジェクトを読み込み <input type="file" id="projectFileInput" accept=".json,.linechat.json,application/json"></label>
          <div id="sourceStatus" class="source-status" data-state="idle" role="status" aria-live="polite">新規トークを編集中</div>
          <label class="self-picker settings-field" for="selfSelector"><span>送信側：</span><select id="selfSelector" disabled><option value="">未読み込み</option></select></label>
          <label class="chat-mode-picker settings-field" for="chatModeSelector"><span>会話形式：</span><select id="chatModeSelector" aria-label="会話形式"><option value="auto">自動</option><option value="direct">個チャ</option><option value="group">グループ</option></select></label>
          <button type="button" id="newProjectButton" class="menu-action">新しいトークを作成</button>
          <button type="button" id="exportTxtButton" class="menu-action">LINE形式のTXTで保存</button>
          <button type="button" id="exportProjectButton" class="menu-action">JSONとして保存（画像・編集状態も保持）</button>
          <p class="settings-note">編集内容はこのブラウザ内へ自動保存されます。原本のTXTは変更しません。別端末へ移すにはJSON保存を使用してください。</p>
        </div>
      </div>
    </section>
    </div>
  <div id="editorErrorToast" class="editor-error-toast" role="alert" hidden></div>
  <input id="inlineMediaInput" type="file" hidden>
  <script src="script.js"></script>
  <script src="txt-export.js"></script>
  <script src="editor.js"></script>
  <script type="module">
    // M3 independent static-page pilot; never import the editor in normal visits.
    if (new URL(location.href).searchParams.get("visual_editor_v2") === "1") {
      Promise.all([
        import("./visual-editor-platform/ui.mjs"),
        import("./visual-editor-platform/site-profile.mjs")
      ]).then(([{mountVisualEditor},{lineVisualEditorConfig}]) =>
        mountVisualEditor(lineVisualEditorConfig)
      ).catch(error => console.error("Opt-in visual editor:", error));
    }
  </script>
</body>
</html>
