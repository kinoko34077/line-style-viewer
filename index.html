<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE風トークビューア</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="viewer-header">
    <h1>LINE風トークビューア</h1>
    <label class="self-picker" for="selfSelector">
      <span>自分：</span>
      <select id="selfSelector" disabled>
        <option value="">未読み込み</option>
      </select>
    </label>
  </header>
  <div class="file-controls">
    <input type="file" id="fileInput" accept=".txt,.md" />
    <div id="sourceStatus" class="source-status" data-state="idle" role="status" aria-live="polite">ファイル未選択</div>
  </div>
  <div id="chatContainer"></div>
  <script src="script.js"></script>
</body>
</html>
