name: Publish LINE chat editor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: line-style-viewer-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout accepted main
        uses: actions/checkout@v4
      - name: Stage only static public application assets
        run: |
          mkdir -p _site
          cp index.html script.js editor.js txt-export.js style.css editor.css _site/
          cp -R default _site/
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/txt-export.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish accepted main
        id: deploy
        uses: actions/deploy-pages@v4
